<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NordicLaw Manuscripts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 16px; }
    #controls { position: sticky; top: 0; z-index: 1000; background: #fff; padding-bottom: 8px; }
    #layout { display: flex; align-items: flex-start; }
    #facet-sidebar { flex: 0 0 340px; max-height: calc(100vh - 140px); overflow-y: auto; }
    #facet-resizer {
      flex: 0 0 8px; align-self: stretch; margin: 0 4px; cursor: ew-resize; border-radius: 4px;
      background: linear-gradient(to right, transparent 3px, #ced4da 3px, #ced4da 5px, transparent 5px);
    }
    #facet-resizer:hover, body.sidebar-resizing #facet-resizer { background-color: #e9ecef; }
    body.sidebar-resizing { cursor: ew-resize; user-select: none; }
    body.facets-hidden #facet-sidebar, body.facets-hidden #facet-resizer { display: none; }
    .range-label { font-size: 0.75rem; text-transform: uppercase; }
    #results { flex: 1 1 auto; min-width: 0; }
    .table-responsive { max-height: calc(100vh - 180px); overflow: auto; }
    .facet-count { font-size: 0.85em; }
    .facet-zero { opacity: 0.45; }
    .accordion-button { padding: 0.5rem 0.75rem; }

    /* Manuscript View merged table */
    .merged-table { border-collapse: collapse; font-size: 0.88rem; }
    .merged-table th, .merged-table td {
      border: 1px solid #dee2e6; padding: 4px 6px; vertical-align: top;
    }
    .merged-table thead th {
      position: sticky; top: 0; z-index: 5; background: #f8f9fa; background-clip: padding-box;
      box-shadow: 0 1px 0 rgba(0,0,0,0.15); /* no sub-pixel bleed-through while scrolling */
    }
    /* Manuscript striping: match Bootstrap's table striping tone (as legacy). */
    .merged-table tbody tr.ms-a > td { background: var(--bs-table-striped-bg, rgba(0,0,0,0.05)); }
    .merged-table tbody tr.ms-b > td { background: transparent; }
    /* Production-unit indicator: a coloured bar on the left of the cell. */
    .merged-table td.pu-a { box-shadow: inset 4px 0 0 rgba(255,193,7,0.65); }
    .merged-table td.pu-b { box-shadow: inset 4px 0 0 rgba(220,53,69,0.55); }
    .merged-table tr.ms-sep { border-top: 3px solid rgba(0,0,0,0.15); }
    /* Production Unit View: per-unit header row; the label stays in view when scrolling sideways */
    .merged-table tbody tr.unit-head > td { background: var(--bs-secondary-bg, #e9ecef); }
    .unit-head-label { position: sticky; left: 0.5rem; display: inline-block; }

    /*
      Frozen (sticky-left) Depository + Shelfmark columns, both views; left + an opaque
      background are set inline by JS. With collapsed borders a sticky cell doesn't carry
      its borders (they stay in the scrolling grid), so the seams and the right-edge
      divider are drawn with pseudo-elements that move with the cell (as legacy).
    */
    .merged-table th.frozen-col,
    .merged-table td.frozen-col { position: sticky; background-clip: border-box; }
    .merged-table td.frozen-col { z-index: 6; }
    .merged-table th.frozen-col { z-index: 12; }
    /* Cover the 1px seam left of each frozen cell (3px before the first). */
    .merged-table th.frozen-col::before,
    .merged-table td.frozen-col::before {
      content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 1px;
      background-color: inherit; pointer-events: none;
    }
    .merged-table th.frozen-col-first::before,
    .merged-table td.frozen-col-first::before { left: -3px; width: 3px; }
    /* The Depository|Shelfmark divider: grey, and 2px so it also covers the sub-pixel
       seam the denser table leaves at fractional column offsets. */
    .merged-table th.frozen-col:not(.frozen-col-first)::before,
    .merged-table td.frozen-col:not(.frozen-col-first)::before {
      left: -2px; width: 2px; background-color: var(--bs-border-color, #dee2e6);
    }
    /* Right-edge divider that stays with the frozen columns. */
    .merged-table th.frozen-col-edge::after,
    .merged-table td.frozen-col-edge::after {
      content: ""; position: absolute; top: 0; bottom: 0; right: -1px; width: 2px;
      background: rgba(0,0,0,0.12); pointer-events: none;
    }
  </style>
</head>
<body>
  <h1 class="h4 mb-1">NordicLaw Manuscripts (Beta)</h1>
  <div id="status" class="text-secondary small mb-2"></div>

  <div id="controls" class="row g-2 align-items-center mb-2">
    <div class="col" style="min-width: 220px;">
      <input type="text" id="search" class="form-control" placeholder="Search all fields…" autocomplete="off">
    </div>
    <div class="col-auto">
      <button id="search-btn" class="btn btn-primary" type="button">Search</button>
    </div>
    <div class="col-auto">
      <button id="clear-filters" class="btn btn-outline-secondary" type="button">Clear search/facets</button>
    </div>
    <div class="col-auto">
      <button id="toggle-facets" class="btn btn-outline-secondary" type="button">Hide facets</button>
    </div>
    <div class="col-auto">
      <select id="view-select" class="form-select" aria-label="View">
        <option value="merged">Manuscript View</option>
        <option value="units">Production Unit View</option>
        <option value="table">Text View</option>
      </select>
    </div>
    <div class="col-auto">
      <select id="sort-select" class="form-select" aria-label="Sort">
        <option value="shelfmark">Sort: Shelfmark</option>
        <option value="dating">Sort: Dating</option>
        <option value="relevance">Sort: Relevance</option>
      </select>
    </div>
    <div class="col-auto">
      <select id="page-size-select" class="form-select" aria-label="Page size">
        <option value="20">20 / page</option>
        <option value="50">50 / page</option>
        <option value="100">100 / page</option>
        <option value="all">All</option>
      </select>
    </div>
    <div class="col-auto dropdown">
      <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">Columns</button>
      <div class="dropdown-menu dropdown-menu-end p-2" id="columns-menu" style="max-height:70vh; overflow-y:auto; min-width:280px;"></div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-2">
    <div id="result-meta" class="text-secondary small"></div>
    <div id="pager" data-total-pages="1"></div>
  </div>

  <div id="layout">
    <aside id="facet-sidebar" class="border rounded">
      <h3 class="mt-2 mb-3 px-2">Facet Search</h3>
      <div id="facet-accordion"></div>
    </aside>
    <div id="facet-resizer" role="separator" aria-orientation="vertical" title="Drag to resize sidebar"></div>
    <section id="results">
      <div id="table-view"></div>
      <div id="merged-view" style="display:none;"></div>
    </section>
  </div>

  <!-- Manuscript details modal -->
  <div class="modal fade" id="msDetailsModal" tabindex="-1" aria-labelledby="msDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="msDetailsModalLabel">Manuscript</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="ms-details-content"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="download-ms-pdf-btn">Download as PDF</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Text View row-details modal -->
  <div class="modal fade" id="rowDetailsModal" tabindex="-1" aria-labelledby="rowDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="rowDetailsModalLabel">Text Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body"><div id="row-details-content"></div></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="download-pdf-btn">Download as PDF</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
